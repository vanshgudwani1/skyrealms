# ==============================================================================
# SkyRealms Economy Configuration
# ==============================================================================

# Primary currency used for Vault economy bridging
vault-bridge:
  enabled: true
  primary-currency: "coins"

# Cache settings
cache:
  # Duration in minutes before idle offline player wallets are evicted
  idle-eviction-minutes: 30

# Transaction rules
rules:
  # Minimum amount that can be sent via /pay
  min-pay-amount: 1.00
  # Maximum single transaction amount (0 for no limit)
  max-pay-amount: 1000000.00
