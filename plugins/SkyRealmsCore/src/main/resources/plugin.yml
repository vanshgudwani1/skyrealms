name: SkyRealmsCore
version: 1.0.0
main: com.skyrealms.core.SkyRealmsCorePlugin
api-version: '1.21'
author: SkyRealms Team
description: Foundational core engine, service locator, and module lifecycle manager for SkyRealms.
commands:
  skyrealms:
    description: Primary management command for SkyRealms.
    permission: skyrealms.admin
    usage: /skyrealms [status|modules|reload]
    aliases: [sr]
permissions:
  skyrealms.admin:
    description: Allows administrative access to SkyRealms commands.
    default: op
