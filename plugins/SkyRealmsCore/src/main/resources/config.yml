# ========================================================
# SkyRealms Core Configuration
# ========================================================

# Enable detailed debug logging across modules
debug: false

# Thread pool configuration for async event dispatch
threading:
  event-bus-workers: 4

# Module manager settings
modules:
  auto-enable-on-boot: true

# Extra custom world folders in server root to auto-load on boot
extra-worlds:
  - fullya
  - fullya_end
