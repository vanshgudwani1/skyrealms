# ==============================================================================
# SkyRealms Farming Engine Configuration
# ==============================================================================

generator:
  default:
    enabled: true
    max-generators-per-island: 5
    base-regeneration-delay-ticks: 200
    min-regeneration-delay-ticks: 40
    require-island: true
    core-material: LODESTONE

  tiers:
    wheat:
      enabled: true
      display-name: "&eBasic Wheat Generator"
      required-farming-level: 1
      base-xp: 15
      production-limit: 1000

    root:
      enabled: true
      display-name: "&6Root Crop Generator"
      required-farming-level: 5
      base-xp: 25
      production-limit: 2500

    fruit:
      enabled: true
      display-name: "&aFruit & Gourd Generator"
      required-farming-level: 12
      base-xp: 45
      production-limit: 5000

    tropical:
      enabled: true
      display-name: "&2Tropical Plant Generator"
      required-farming-level: 20
      base-xp: 75
      production-limit: 10000

    mystic:
      enabled: true
      display-name: "&dMystic Arcane Generator"
      required-farming-level: 30
      base-xp: 150
      production-limit: 25000

  upgrades:
    speed:
      enabled: true
      max-level: 10
      base-cost: 1000
      cost-multiplier: 1.8
      ticks-reduction-per-level: 12

    yield:
      enabled: true
      max-level: 5
      base-cost: 2500
      cost-multiplier: 2.0
      bonus-drop-chance-per-level: 0.15

    mutation:
      enabled: true
      max-level: 5
      base-cost: 5000
      cost-multiplier: 2.5
      bonus-mutation-chance-per-level: 0.005

    xp_boost:
      enabled: true
      max-level: 5
      base-cost: 3000
      cost-multiplier: 2.0
      bonus-xp-multiplier-per-level: 0.20

    capacity:
      enabled: true
      max-level: 3
      base-cost: 10000
      cost-multiplier: 3.0
      max-nodes-per-level: 4

  mutations:
    base-chance: 0.015
    types:
      golden:
        enabled: true
        weight: 40
        value-multiplier: 3.0
      giant:
        enabled: true
        weight: 30
        xp-multiplier: 3.0
      ancient:
        enabled: true
        weight: 15
      fertile:
        enabled: true
        weight: 10
        drop-multiplier: 2.0
      magical:
        enabled: true
        weight: 5


# ==============================================================================
# SkyRealms Garden — mcMMO Farming, Abilities, Crop Mastery & Balance Config
# ==============================================================================
garden:
  world: "skyrealms_garden"
  grid:
    spacing: 1024
    region-size: 768

  reward-caps:
    max-combined-bonus-drop-chance: 0.75
    max-bonus-drops-per-harvest: 3
    max-xp-multiplier: 2.0
    golden-sprout-max-coins-per-harvest: 250.0
    golden-sprout-daily-coin-cap: 15000.0
    golden-sprout-log-threshold: 500.0

  abilities:
    bountiful-harvest:
      enabled: true
      unlock-level: 1
      min-chance: 0.05
      max-chance: 0.50
      max-scale-level: 100
      eligible-crops:
        - WHEAT
        - CARROT
        - POTATO
        - BEETROOT
        - MELON
        - PUMPKIN
        - SUGAR_CANE
        - CACTUS
        - COCOA
        - NETHER_WART

    verdant-aura:
      enabled: true
      unlock-level: 10
      haste-1-level: 10
      speed-1-level: 25
      haste-2-level: 50
      duration-ticks: 200

    sakura-surge:
      enabled: true
      unlock-level: 15
      min-duration-seconds: 10
      max-duration-seconds: 20
      min-cooldown-seconds: 30
      base-cooldown-seconds: 60

    golden-sprout:
      enabled: true
      unlock-level: 30
      min-chance: 0.01
      max-chance: 0.15
      max-scale-level: 100
      level-coin-bonus: 1.25
      mastery-tier-coin-bonus: 5.0
      crop-base-coins:
        WHEAT: 12.0
        CARROT: 14.0
        POTATO: 14.0
        BEETROOT: 16.0
        MELON: 15.0
        PUMPKIN: 18.0
        SUGAR_CANE: 15.0
        CACTUS: 16.0
        COCOA: 18.0
        NETHER_WART: 22.0

  crops:
    wheat:
      xp: 10
      replant-material: WHEAT_SEEDS
    carrots:
      xp: 12
      replant-material: CARROT
    potatoes:
      xp: 12
      replant-material: POTATO
    beetroots:
      xp: 15
      replant-material: BEETROOT_SEEDS
    melon:
      xp: 18
      replant-material: MELON_SEEDS
    pumpkin:
      xp: 20
      replant-material: PUMPKIN_SEEDS
    sugar_cane:
      xp: 14
      replant-material: SUGAR_CANE
    cactus:
      xp: 16
      replant-material: CACTUS
    cocoa:
      xp: 15
      replant-material: COCOA_BEANS
    nether_wart:
      xp: 25
      replant-material: NETHER_WART
