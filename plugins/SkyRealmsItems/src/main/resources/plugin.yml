name: SkyRealmsItems
version: 1.0.0
main: com.skyrealms.items.SkyRealmsItemsPlugin
api-version: '1.21'
author: SkyRealms Team
description: Upgradable Farming Hoes and vanilla-enchant protection for SkyRealms.
depend: [SkyRealmsCore]
softdepend: [SkyRealmsEconomy, EliteEnchantments]
commands:
  items:
    description: Browse SkyRealms Farming Hoes, upgrade your held hoe, or inspect gear stats.
    usage: /items [upgrade|list|stats|inspect|give]
    aliases: [sritems, gear, catalog, hoe]
