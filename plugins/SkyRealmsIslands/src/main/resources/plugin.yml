name: SkyRealmsIslands
version: '1.0.0'
main: com.skyrealms.islands.SkyRealmsIslandsPlugin
api-version: '1.21'
author: SkyRealms Team
description: Authoritative SkyBlock island management engine for SkyRealms.
prefix: SkyRealms-Islands
depend: [SkyRealmsCore, SkyRealmsDatabase, SkyRealmsPlayer, SkyRealmsEconomy]

commands:
  island:
    description: Core SkyBlock island management command.
    aliases: [is]
    permission: skyrealms.island.use
    usage: /island [help|create|home|invite|accept|kick|leave|visit|settings|info|members|name|reset|delete]

permissions:
  skyrealms.island.use:
    description: Allows accessing basic island features.
    default: true
  skyrealms.island.admin:
    description: Allows bypass of island protections and administrative controls.
    default: op
